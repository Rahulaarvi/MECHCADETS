name: Python CI/CD

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # ✅ Fix Node 20 deprecation warning

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout code
      - name: Checkout repository
        uses: actions/checkout@v5

      # Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5

        with:
          python-version: '3.11'

      # Install dependencies (fixed path issue)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Build step
      - name: Build package
        run: |
          pip install build
          python -m build

      # Test step
      - name: Run tests
        run: |
          pip install pytest
          pytest
