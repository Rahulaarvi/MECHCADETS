name: Python CI/CD

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # ✅ Required for Node 24

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout
      - name: Checkout repository
        uses: actions/checkout@v5

      # Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'   # ✅ add caching (improves performance)

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Build
      - name: Build package
        run: |
          pip install build
          python -m build

      # Test
      - name: Run tests
        run: |
          pip install pytest
          pytest
